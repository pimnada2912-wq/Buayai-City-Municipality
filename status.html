                icon: '✅',
                title: 'เก็บเรียบร้อยแล้ว',
                msg: 'เจ้าหน้าที่ดำเนินการเก็บขยะตามคำขอนี้เรียบร้อยแล้ว ขอบคุณที่ใช้บริการ'
            },
            'ไม่รับ': {
                badge: 'bg-red-100 text-red-800',
                icon: '❌',
                title: 'ไม่สามารถรับคำขอนี้ได้',
                msg: 'เจ้าหน้าที่ไม่สามารถรับคำขอนี้ได้ กรุณาติดต่อเจ้าหน้าที่เพื่อสอบถามรายละเอียด หรือส่งคำขอใหม่'
            }
        };

        function showMessage(html) {
            const box = document.getElementById('resultBox');
            box.innerHTML = html;
            box.classList.remove('hidden');
        }

        function renderCard(r) {
            const info = STATUS_INFO[r.status] || {
                badge: 'bg-slate-100 text-slate-700', icon: 'ℹ️',
                title: r.status || 'ไม่ทราบสถานะ',
                msg: 'กรุณาติดต่อเจ้าหน้าที่เพื่อสอบถามรายละเอียด'
            };
            return `
                <div class="bg-white rounded-2xl shadow-md p-5 border border-slate-200/80 space-y-4">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <p class="text-xs text-gray-500">รหัสคำขอ (ใช้แจ้งเจ้าหน้าที่ได้)</p>
                            <p class="font-bold text-emerald-800 text-lg">${esc(r.code)}</p>
                        </div>
                        <span class="${info.badge} text-xs px-3 py-1.5 rounded-full font-bold whitespace-nowrap">${info.icon} ${esc(info.title)}</span>
                    </div>
                    <p class="text-sm text-gray-600 bg-slate-50 border border-slate-200 rounded-xl p-3">${esc(info.msg)}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm text-gray-600">
                        <p>📅 <strong>วันนัดหมาย:</strong> ${esc(r.appt_date || '-')}</p>
                        <p>📍 <strong>วิธีทิ้ง:</strong> ${esc(r.method || '-')}</p>
                        <p>📦 <strong>สิ่งของ:</strong> ${esc(r.waste_type || '-')} (${esc(r.qty || 1)} ชิ้น)</p>
                        <p>🏘️ <strong>ชุมชน:</strong> ${esc(r.zone || '-')}</p>
                    </div>
                </div>`;
        }

        async function checkStatus(e) {
            if (e) e.preventDefault();
            const phone = document.getElementById('reqPhone').value.trim();
            const date = document.getElementById('reqDate').value;
            const btn = document.getElementById('checkBtn');

            if (!phone || !date) return;

            btn.disabled = true;
            btn.innerText = 'กำลังตรวจสอบ...';
            showMessage('<p class="text-center text-gray-500 py-6">กำลังค้นหา...</p>');

            try {
                const { data, error } = await db.rpc('check_requests_by_phone', {
                    p_phone: phone,
                    p_date: date
                });

                if (error) throw error;

                if (!data || data.length === 0) {
                    showMessage(`
                        <div class="bg-white rounded-2xl shadow-md p-5 border border-red-200 text-center">
                            <div class="text-3xl mb-2">🔎</div>
                            <p class="font-bold text-gray-800">ไม่พบคำขอ</p>
                            <p class="text-sm text-gray-500 mt-1">กรุณาตรวจสอบว่าเบอร์โทรศัพท์และวันที่นัดเก็บตรงกับที่กรอกตอนส่งคำขอ ถ้ายังไม่พบ โปรดติดต่อเจ้าหน้าที่</p>
                        </div>`);
                    return;
                }

                showMessage(data.map(renderCard).join(''));
            } catch (err) {
                console.error(err);
                showMessage(`
                    <div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-sm text-red-700">
                        เกิดข้อผิดพลาดในการตรวจสอบ กรุณาลองใหม่อีกครั้งภายหลัง
                    </div>`);
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = 'ตรวจสอบสถานะ';
                }, 1500);
            }
        }

        // ถ้าเพิ่งส่งคำขอจากหน้าฟอร์ม ให้เติมเบอร์/วันนัดให้และตรวจสอบอัตโนมัติ
        (function prefill() {
            try {
                const raw = sessionStorage.getItem('prefillStatus_buayai');
                if (!raw) return;
                sessionStorage.removeItem('prefillStatus_buayai');
                const v = JSON.parse(raw);
                if (v && v.phone && v.date) {
                    document.getElementById('reqPhone').value = v.phone;
                    document.getElementById('reqDate').value = v.date;
                    checkStatus();
                }
            } catch (e) { /* ไม่เป็นไร ให้กรอกเอง */ }
        })();
    </script>
</body>
</html>
